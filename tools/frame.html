<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>frame harness</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  /* 无头 Edge 有最小窗口宽度，外层视口不可控；
     固定尺寸 iframe 才能得到被测页面真实的 390x844 视口。 */
  iframe { width: 390px; height: 844px; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="stage"></iframe>
<pre id="probe" hidden></pre>
<script>
  const q = new URLSearchParams(location.search).get('q') || '';
  const stage = document.getElementById('stage');
  const out = document.getElementById('probe');
  stage.addEventListener('load', () => {
    // 同源：把 iframe 内部的探针输出搬到父页面，便于 --dump-dom 抓取。
    try {
      const inner = stage.contentDocument.getElementById('probe');
      out.textContent = inner ? inner.textContent : 'PROBE_JSON:{}';
    } catch (err) {
      out.textContent = 'PROBE_ERROR:' + err.message;
    }
  });
  stage.src = '../index.html' + (q ? '?' + q : '');
</script>
</body>
</html>
